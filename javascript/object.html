<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>
<body>
    <div id="student-info"></div>
    <script>
       let student = {
    name: "Dhawal",
    age: 20,
    course: "CSE"
};
for (let key in student) {
    document.getElementById("student-info").innerHTML += key + ": " + student[key] + "<br>";
}
    </script>
</body>
</html>
