<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>
</head>
<body>
    <script>
        function addNumbers(a, b) {
            return a + b;
        }
        let num1 = 5;
        let num2 = 10;
        let sum = addNumbers(num1, num2);

        document.write("The sum of " + num1 + " and " + num2 + " is: " + sum);
    </script>
</body>
</html>
