<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
</head>
<body>
    <h1>Weather</h1>
    <div id="weather"> 
        <p>Fetching weather data...</p>
        select your city:
        <select id="citySelect">
            <option value="35.6895,139.6917">Tokyo</option>
            <option value="40.7128,-74.0060">New York</option>
            <option value="51.5074,-0.1278">London</option>
            <option value="48.8566,2.3522">Paris</option>
            <option value="34.0522,-118.2437">Los Angeles</option>
        </select>
    </div> 
    <script>
        const weatherDiv = document.getElementById("weather");
        const url = "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&hourly=temperature_2m";

        async function loadWeather() {
            try {
                const res = await fetch(url);
                if (!res.ok) {
                    throw new Error("Failed to fetch weather data");
                }

                const data = await res.json();
                const temperature = data.hourly.temperature_2m[0];

                weatherDiv.innerHTML = `<p>Current Temperature: ${temperature}°C</p>`;
            } catch (err) {
                console.error("Error fetching weather data:", err);
                weatherDiv.innerHTML = "<p>Failed to load weather data.</p>";
            }
        }

        loadWeather();
    </script>
</body>
</html>
