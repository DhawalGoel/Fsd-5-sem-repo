<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MY SHOP</title>
  </head>
  <style>
    table {
      width: 80%;
      margin: auto;
      padding: 10px;
      font-size: 25px;
      color: #eb1616;
    }
    table,
    th,
    td {
      border: 1px solid #dc11f7;
    }
  </style>
  <body>
    <table>
      <thead>
        <tr>
          <th>S.no.</th>
          <th>Title</th>
          <th>image</th>
          <th>Category</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>
    <script>
      const ele = document.getElementById("data");
      const url = "https://dummyjson.com/products";

      async function loadData() {
        try {
          const res = await fetch(url);
          if (!res.ok) {
            throw new Error("Failed to fetch products");
          }

          const data = await res.json();
          const products = data.products || [];

          ele.innerHTML = products
            .map((item, index) => {
              const imageUrl = item.images?.[0] || item.thumbnail || "https://placehold.co/100x100?text=No+Image";

              return `
                <tr>
                  <td>${index + 1}</td>
                  <td>${item.title}</td>
                  <td><img src="${imageUrl}" width="100" height="100" alt="${item.title}" /></td>
                  <td>${item.category}</td>
                  <td>${item.price}</td>
                </tr>
              `;
            })
            .join("");
        } catch (err) {
          console.error("ERROR", err);
          ele.innerHTML = "<tr><td colspan='5'>Data not loaded. Please check the API or network.</td></tr>";
        }
      }
      loadData();
    </script>
  </body>
</html>
