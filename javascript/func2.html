<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    <script>
    function add(a, b) {
        return a + b + "<br>";
    }
    document.write(add(5, 10));

    const abes = () => "Hello, World!" + "<br>";
    document.write(abes());
    </script>
</body>
</html>
