<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
        <p id="demo"></p>
    <script>
        const car = ["BMW", "Volvo", "Saab", "Ford" , "Fiat", "Audi"];
        for (let i = 1; i < car.length; i+2) {
            document.write( + i + ": " + car[i] + "<br>");

        }
        document.getElementById("demo").innerHTML = car;
    </script>
</body>
</html>
